spring.application.name=backend
server.port=${PORT:8081}

# MySQL database (configured for Railway and local development)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:jwtauthdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:pass123}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
# 256-bit+ secret, base64 encoded. Replace with a securely generated secret in production.
app.jwt.secret=${JWT_SECRET:ZmMyNWM4ZmQ0YjE3ZjQxOTNkNGE1ZDY2ZjA4YzY2ZmZjMjVjOGZkNGIxN2Y0MTkzZDRhNWQ2NmYwOGM2NmY=}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# Frontend origin allowed for CORS (supports comma-separated URLs)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
